<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股20日线回踩选股</title>
<style>
:root{--bg:#0f1419;--card:#1a2129;--border:#2a3441;--text:#e6edf3;--muted:#8b98a5;--accent:#4da3ff;--up:#ef4444;--down:#22c55e;--gold:#f59e0b}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}.container{max-width:1400px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:16px}h1{font-size:22px}.meta,.foot{color:var(--muted);font-size:13px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px}.stat b{display:block;font-size:20px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px}.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border)}th{background:#232c37;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0}th:first-child,td:first-child{text-align:left}tr:hover td{background:#202932}.up{color:var(--up)}.down{color:var(--down)}.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11.5px}.tag.first{background:#f59e0b26;color:var(--gold)}.tag.reso{background:#4ade8020;color:#4ade80}.tag.sector{background:#4da3ff20;color:var(--accent)}.empty{text-align:center;padding:40px;color:var(--muted)}.foot{margin-top:14px}
</style></head>
<body><div class="container">
<header><h1>📈 A股20日线回踩选股<small class="meta">沪深主板 · 每日收盘后更新</small></h1><div class="meta" id="meta"></div></header>
<div class="stats" id="stats"></div>
<div class="controls"><input id="search" placeholder="搜索代码/名称/板块..."><select id="capFilter"><option value="">全部市值</option><option value="50-300">总市值50亿～300亿（200亿左右）</option><option value="50-250">总市值50亿～250亿</option><option value="150-250">总市值150亿～250亿</option></select><select id="firstFilter"><option value="">全部回踩</option><option value="first">仅第一次回踩</option><option value="nonfirst">非第一次</option></select><select id="resoFilter"><option value="">全部板块</option><option value="yes">仅板块共振</option></select><select id="statusFilter"><option value="">全部状态</option><option value="new">新增</option><option value="kept">持续</option></select><span class="meta" id="count"></span></div>
<div class="table-wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" style="display:none">暂无符合条件的股票</div></div><div class="foot" id="foot"></div>
</div><script>
const COLS=[['code','代码','str'],['name','名称','str'],['sector','板块','str'],['status','状态','str'],['price','现价','num'],['pct_chg','涨跌幅%','num'],['mktcap','总市值(亿)','num'],['dist_ma20','距MA20%','num'],['slope_ma20','MA20斜率%','num'],['vol_ratio','量比','num'],['pullback_date','回踩日','str'],['is_first','首次回踩','bool'],['resonance','板块共振','bool'],['score','评分','num']];let data=null,sortKey='score',sortDir=-1;
function fmt(v,d=2){return v==null||isNaN(v)?'-':Number(v).toFixed(d)}function renderHeader(){thead.innerHTML=COLS.map(c=>`<th onclick="setSort('${c[0]}')">${c[1]}${sortKey===c[0]?(sortDir<0?' ▼':' ▲'):''}</th>`).join('')}function setSort(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=['score','slope_ma20','mktcap'].includes(k)?-1:1}renderHeader();render()}
function rows(){let q=search.value.trim().toLowerCase(),cap=capFilter.value,f1=firstFilter.value,f2=resoFilter.value,f3=statusFilter.value;return(data.results||[]).map(x=>({...x,status:x.status||'kept'})).filter(x=>{let okCap=!cap||((cap==='50-300'&&x.mktcap>=50&&x.mktcap<=300)||(cap==='50-250'&&x.mktcap>=50&&x.mktcap<=250)||(cap==='150-250'&&x.mktcap>=150&&x.mktcap<=250));return okCap&&(!f1||(f1==='first'?x.is_first:!x.is_first))&&(!f2||x.resonance)&&(!f3||x.status===f3)&&(!q||String(x.code).includes(q)||String(x.name).toLowerCase().includes(q)||String(x.sector||'').toLowerCase().includes(q))})}
function render(){let rs=rows();count.textContent=`显示 ${rs.length} / ${(data.results||[]).length} 只`;rs.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(['is_first','resonance'].includes(sortKey)){x=x?1:0;y=y?1:0}if(typeof x==='string'){x=x.toLowerCase();y=(y||'').toLowerCase()}return x<y?-sortDir:x>y?sortDir:0});empty.style.display=rs.length?'none':'block';tbody.innerHTML=rs.map(x=>`<tr><td>${x.code}</td><td>${x.name||''}</td><td>${x.sector?`<span class="tag sector">${x.sector}</span>`:'-'}</td><td>${x.status||'-'}</td><td>${fmt(x.price)}</td><td class="${x.pct_chg>=0?'up':'down'}">${fmt(x.pct_chg)}%</td><td>${fmt(x.mktcap)}</td><td>${fmt(x.dist_ma20)}%</td><td>${fmt(x.slope_ma20)}%</td><td>${fmt(x.vol_ratio)}</td><td>${x.pullback_date||'-'}</td><td>${x.is_first?'<span class="tag first">首次</span>':'-'}</td><td>${x.resonance?'<span class="tag reso">共振</span>':'-'}</td><td><b>${fmt(x.score,1)}</b></td></tr>`).join('')}
async function load(){try{let r=await fetch('data.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();let a=data.results||[];stats.innerHTML=`<div class="stat"><b>${a.length}</b><span>命中总数</span></div><div class="stat"><b>${a.filter(x=>x.is_first).length}</b><span>第一次回踩</span></div><div class="stat"><b>${a.filter(x=>x.resonance).length}</b><span>板块共振</span></div>`;meta.textContent=`生成时间：${data.generated_at||'-'}`;foot.textContent='筛选规则：MA20回踩、缩量、收盘确认；市值筛选为总市值50亿～300亿元（约200亿）。技术面初筛，非投资建议。';renderHeader();render()}catch(e){empty.style.display='block';meta.textContent='⚠️ 未找到 data.json'}}
['search','capFilter','firstFilter','resoFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener('input',render));load();
</script></body></html>
