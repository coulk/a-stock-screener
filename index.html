<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股 20日线回踩选股</title>
<style>
  :root {
    --bg: #0f1419; --card: #1a2129; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4da3ff;
    --up: #ef4444; --down: #22c55e; --gold: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  h1 { font-size: 22px; }
  h1 small { color: var(--muted); font-size: 13px; font-weight: normal; margin-left: 10px; }
  .meta { color: var(--muted); font-size: 13px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; }
  .stat b { display: block; font-size: 20px; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--muted); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  input, select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 6px; font-size: 13px;
  }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
  th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--border); }
  th { background: #232c37; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; }
  th:hover { color: var(--text); }
  th:first-child, td:first-child { text-align: left; }
  tr:hover td { background: #202932; }
  td.up { color: var(--up); } td.down { color: var(--down); }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11.5px; }
  .tag.first { background: rgba(245,158,11,.15); color: var(--gold); border: 1px solid rgba(245,158,11,.4); }
  .tag.reso { background: rgba(74,222,128,.12); color: #4ade80; border: 1px solid rgba(74,222,128,.35); }
  .tag.sector { background: rgba(77,163,255,.12); color: var(--accent); border: 1px solid rgba(77,163,255,.3); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .sort-ind { color: var(--accent); }
  .up-arrow::after { content: " ▲"; color: var(--accent); }
  .down-arrow::after { content: " ▼"; color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📈 A股 20日线回踩选股<small>沪深主板 · 每日收盘后更新</small></h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="搜索代码/名称/板块...">
    <select id="firstFilter">
      <option value="">全部回踩</option>
      <option value="first">仅第一次回踩</option>
      <option value="nonfirst">非第一次</option>
    </select>
    <select id="resoFilter">
      <option value="">全部</option>
      <option value="yes">仅板块共振</option>
    </select>
    <span class="meta" id="count"></span>
  </div>

  <div class="table-wrap">
    <table id="tbl">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">暂无符合条件的股票（或数据尚未生成）</div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const COLS = [
  { key: 'code', label: '代码', sort: 'str' },
  { key: 'name', label: '名称', sort: 'str' },
  { key: 'sector', label: '板块', sort: 'str' },
  { key: 'price', label: '现价', sort: 'num' },
  { key: 'dist_ma20', label: '距MA20%', sort: 'num' },
  { key: 'slope_ma20', label: 'MA20斜率%', sort: 'num' },
  { key: 'vol_ratio', label: '量比', sort: 'num' },
  { key: 'pullback_date', label: '回踩日', sort: 'str' },
  { key: 'is_first', label: '首次回踩', sort: 'bool' },
  { key: 'resonance', label: '板块共振', sort: 'bool' },
  { key: 'score', label: '评分', sort: 'num' },
];

let data = null;
let sortKey = 'score', sortDir = -1;

async function load() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    document.getElementById('meta').textContent = '⚠️ 未找到 data.json（等待每日更新任务生成）';
    document.getElementById('empty').style.display = 'block';
    return;
  }
  renderHeader();
  renderStats();
  render();
}

function renderHeader() {
  const tr = document.getElementById('thead');
  tr.innerHTML = COLS.map(c =>
    `<th data-key="${c.key}" onclick="setSort('${c.key}')">${c.label}${sortKey === c.key ? (sortDir < 0 ? '<span class="sort-ind">▼</span>' : '<span class="sort-ind">▲</span>') : ''}</th>`
  ).join('');
}

function renderStats() {
  const r = data.results || [];
  const first = r.filter(x => x.is_first).length;
  const reso = r.filter(x => x.resonance).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${r.length}</b><span>命中总数</span></div>
    <div class="stat"><b>${first}</b><span>第一次回踩</span></div>
    <div class="stat"><b>${reso}</b><span>板块共振</span></div>
    <div class="stat"><b>${data.candidates ?? '-'}</b><span>粗筛候选</span></div>
    <div class="stat"><b>${data.total_spot ?? '-'}</b><span>全市场</span></div>
  `;
  document.getElementById('meta').textContent =
    `生成时间：${data.generated_at ?? '-'} ｜ 数据源：多源降级(Yahoo/新浪/腾讯/东财)`;
  document.getElementById('foot').textContent =
    `筛选规则：MA20向上或刚拐头 ＋ 近3日回踩20日线附近 ＋ 收盘确认收回MA20上方 ＋ 回踩日缩量(<5日均量×80%) ＋ 板块共振加分。⚠️ 本页面为技术面初筛结果，非投资建议。`;
}

function setSort(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = (key === 'score' || key === 'slope_ma20') ? -1 : 1; }
  renderHeader();
  render();
}

function filterRows() {
  if (!data) return [];
  const q = document.getElementById('search').value.trim().toLowerCase();
  const f1 = document.getElementById('firstFilter').value;
  const f2 = document.getElementById('resoFilter').value;
  return (data.results || []).filter(x => {
    if (f1 === 'first' && !x.is_first) return false;
    if (f1 === 'nonfirst' && x.is_first) return false;
    if (f2 === 'yes' && !x.resonance) return false;
    if (q && !(String(x.code).includes(q) || String(x.name).toLowerCase().includes(q) || String(x.sector || '').toLowerCase().includes(q))) return false;
    return true;
  });
}

function fmtNum(v, digits = 2) {
  return (v === null || v === undefined || isNaN(v)) ? '-' : Number(v).toFixed(digits);
}

function render() {
  const rows = filterRows();
  document.getElementById('count').textContent = `显示 ${rows.length} / ${(data.results || []).length} 只`;
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  if (!rows.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const sorted = [...rows].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'is_first' || sortKey === 'resonance') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
    else if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });

  tbody.innerHTML = sorted.map(x => {
    const up = x.dist_ma20 >= 0, distCls = up ? 'up' : 'down';
    const slopeCls = x.slope_ma20 >= 0 ? 'up' : 'down';
    const volCls = x.vol_ratio <= 0.8 ? 'up' : 'down';
    return `<tr>
      <td>${x.code}</td><td>${x.name || ''}</td>
      <td>${x.sector ? `<span class="tag sector">${x.sector}</span>` : '-'}</td>
      <td>${fmtNum(x.price)}</td>
      <td class="${distCls}">${fmtNum(x.dist_ma20)}%</td>
      <td class="${slopeCls}">${fmtNum(x.slope_ma20)}%</td>
      <td class="${volCls}">${fmtNum(x.vol_ratio)}</td>
      <td>${x.pullback_date || '-'}</td>
      <td>${x.is_first ? '<span class="tag first">首次</span>' : '-'}</td>
      <td>${x.resonance ? '<span class="tag reso">共振</span>' : '-'}</td>
      <td><b>${fmtNum(x.score, 1)}</b></td>
    </tr>`;
  }).join('');
}

load();
</script>
</body>
</html>
